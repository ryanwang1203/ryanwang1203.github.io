title: "Ryan Wang's Personal Website"
subtitle: "Ph.D. Student • AI Researcher"
name: "Ryan Wang"
url: "https://ryanwang1203.github.io"
baseurl: ""
repository: "ryanwang1203/ryanwang1203.github.io"

# Minimal Mistakes (GitHub Pages-compatible)
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dirt"   #"contrast" / "dark" / "dirt"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-include-cache

locale: "en-US"
timezone: "America/Los_Angeles"

# Author / social
author:
  name: "Ryan Wang"
  avatar: "/assets/images/IMG_8335.jpeg"
  bio: "Physical AI, Engineering Design" 
  location: "Santa Clara, CA"
  email: "ywang54@scu.edu"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ryanwang1203"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/ryan-wang-543abb2ba"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=CWkJY8gAAAAJ&hl=zh-CN"
    - label: "Resume"
      icon: "fas fa-fw fa-file-pdf"
      url: "/assets/files/ResumeRyanWang.pdf"

# Collections
collections:
  publications:
    output: true
    permalink: /publications/:path/
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
     
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
      
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
     

# Build settings
markdown: kramdown
kramdown:
  input: GFM
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
